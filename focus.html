<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Focus Lock — Mina</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f7f5f0;
        --surface: #fffefb;
        --ink: #1d2721;
        --muted: #6e756f;
        --line: #e6e4dd;
        --accent: #2e6b51;
        --accent-dark: #245640;
        --accent-soft: #e8f0e9;
        --shadow: 0 18px 48px rgb(31 44 36 / 7%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .screen {
        width: min(100%, 390px);
        min-height: 844px;
        margin: 0 auto;
        padding: 28px 24px 34px;
        display: flex;
        flex-direction: column;
      }

      .app-name {
        margin: 0;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 280px;
        margin: 14px 0 0;
        font-size: clamp(2rem, 8vw, 2.5rem);
        line-height: 1.1;
        letter-spacing: -0.055em;
      }

      .date {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .focus-block {
        margin-top: 40px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .block-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .duration {
        padding: 6px 9px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-dark);
        font-size: 0.72rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .time {
        margin: 12px 0 0;
        font-size: 2rem;
        font-weight: 730;
        letter-spacing: -0.055em;
      }

      .lock-mark {
        display: inline-grid;
        width: 28px;
        height: 28px;
        place-items: center;
        margin-top: 19px;
        border-radius: 50%;
        background: var(--accent);
        color: white;
        font-size: 0.9rem;
        font-weight: 800;
        opacity: 0;
        transform: scale(0.7);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .focus-block.is-locked {
        border-color: #c8d9cd;
        background: #fbfdfb;
      }

      .focus-block.is-locked .lock-mark {
        opacity: 1;
        transform: scale(1);
      }

      .status {
        margin: 32px 4px 0;
        min-height: 100px;
      }

      .status h2 {
        margin: 0;
        font-size: 1.2rem;
        letter-spacing: -0.03em;
      }

      .status p {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.55;
      }

      .actions {
        margin-top: auto;
        padding-top: 36px;
      }

      .primary,
      .undo {
        width: 100%;
        min-height: 54px;
        border: 0;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 750;
        transition: background 160ms ease, border-color 160ms ease, color 160ms ease,
          transform 160ms ease;
      }

      .primary {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 8px 18px rgb(46 107 81 / 18%);
      }

      .primary:hover:not(:disabled) {
        background: var(--accent-dark);
      }

      .primary:active:not(:disabled),
      .undo:active {
        transform: translateY(1px);
      }

      .primary:disabled {
        background: #e3e9e4;
        color: #6b766e;
        box-shadow: none;
        cursor: default;
      }

      .undo {
        display: none;
        margin-top: 12px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
      }

      .screen.is-locked .undo {
        display: block;
      }

      button:focus-visible {
        outline: 3px solid #9cc8aa;
        outline-offset: 3px;
      }

      @media (max-height: 844px) {
        .screen {
          min-height: 100vh;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" id="screen">
      <header>
        <p class="app-name">Mina</p>
        <h1>Focus Lock</h1>
        <p class="date">Thứ Sáu 14/8</p>
      </header>

      <section class="focus-block" id="focus-block" aria-labelledby="block-time">
        <div class="block-meta">
          <p class="eyebrow">Khung tập trung</p>
          <span class="duration">90 phút</span>
        </div>
        <p class="time" id="block-time">09:00–10:30</p>
        <span class="lock-mark" id="lock-mark" aria-hidden="true">✓</span>
      </section>

      <section class="status" aria-live="polite" aria-atomic="true">
        <h2 id="status-title">Không có lịch — đây là lợi thế.</h2>
        <p id="status-copy">Inbox vẫn đóng đến 10:30.</p>
      </section>

      <div class="actions">
        <button class="primary" id="lock-button" type="button">Lock focus block</button>
        <button class="undo" id="undo-button" type="button">Undo</button>
      </div>
    </main>

    <script>
      (() => {
        const storageKey = "focus-lock:2026-08-14";
        const screen = document.getElementById("screen");
        const block = document.getElementById("focus-block");
        const lockButton = document.getElementById("lock-button");
        const undoButton = document.getElementById("undo-button");
        const statusTitle = document.getElementById("status-title");
        const statusCopy = document.getElementById("status-copy");

        function readLockState() {
          try {
            return localStorage.getItem(storageKey) === "locked";
          } catch {
            return false;
          }
        }

        function writeLockState(locked) {
          try {
            if (locked) {
              localStorage.setItem(storageKey, "locked");
            } else {
              localStorage.removeItem(storageKey);
            }
          } catch {
            // The interaction still works when storage is unavailable.
          }
        }

        function render(locked) {
          screen.classList.toggle("is-locked", locked);
          block.classList.toggle("is-locked", locked);
          lockButton.disabled = locked;
          lockButton.textContent = locked ? "Locked" : "Lock focus block";
          statusTitle.textContent = locked
            ? "Khung tập trung đã được khóa."
            : "Không có lịch — đây là lợi thế.";
          statusCopy.textContent = locked
            ? "Không thể chèn lịch mới vào 09:00–10:30."
            : "Inbox vẫn đóng đến 10:30.";
        }

        let locked = readLockState();
        render(locked);

        lockButton.addEventListener("click", () => {
          locked = true;
          writeLockState(true);
          render(locked);
        });

        undoButton.addEventListener("click", () => {
          locked = false;
          writeLockState(false);
          render(locked);
          lockButton.focus();
        });
      })();
    </script>
  </body>
</html>
